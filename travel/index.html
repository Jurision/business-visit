<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>广州—青岛—大连—江西 12日行程</title>
<meta name="description" content="2026年10月12日至23日广州、青岛、烟台夜船、大连、新干与南昌12日可调行程草案。">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://trip.arielzhu.space/travel/">
<meta property="og:type" content="website">
<meta property="og:title" content="广州—青岛—大连—江西 12日行程">
<meta property="og:description" content="2026年10月12日出发的12日可调个人行程：青岛、烟台夜船、大连、新干探亲与南昌。">
<meta property="og:url" content="https://trip.arielzhu.space/travel/">
<meta property="og:image" content="https://trip.arielzhu.space/travel/img/personal-trip-watercolor.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f0e7">
<link rel="preconnect" href="https://commons.wikimedia.org">
<link rel="preconnect" href="https://upload.wikimedia.org">
<style>
:root{
  --paper:#f4f0e7;--card:#fffdf8;--ink:#173b43;--muted:#5f6a66;--faint:#8c928d;--line:#e4dccf;--line-strong:#cfc3b1;
  --sea:#2e7f83;--sea-soft:#e2eeec;--red:#b84e36;--red-soft:#f8e8e2;--gold:#8f6320;--gold-soft:#f7eedc;
  --c-gz:#86735e;--c-qd:#2e7f83;--c-dl:#3d6797;--c-xg:#5b8743;--c-nc:#b3762a;
  --shadow:0 1px 2px rgba(23,59,67,.05),0 10px 30px rgba(23,59,67,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a{font:inherit}
button{color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid rgba(46,127,131,.45);outline-offset:2px}
.shell{max-width:680px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom))}

/* 顶部 */
.mast{padding:env(safe-area-inset-top) 4px 16px}
.hero-art{display:block;margin:0 -20px -4px;height:112px;overflow:hidden;line-height:0}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.eyebrow{font-size:13px;font-weight:650;color:var(--red);font-variant-numeric:tabular-nums}
h1{margin:4px 0 10px;font-size:27px;line-height:1.22;font-weight:750;letter-spacing:-.01em}
h1 span{display:block}
.h1-days{color:var(--sea)}
.plan-label{display:inline-flex;align-items:center;gap:6px;margin:0;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:650;color:var(--gold);background:var(--gold-soft)}
.plan-label:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.plan-label.over{color:#9a3a26;background:var(--red-soft)}
.mast-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.today-btn{border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;min-height:32px;padding:0 13px;cursor:pointer}

/* 总览 */
.overview{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ov-head h2{font-size:17px;line-height:1.3;margin:0;font-weight:750}
.ov-tools{display:flex;gap:6px}
.pill-btn.alt{background:var(--ink);color:#fff}
.pill-btn.alt[aria-pressed="true"]{background:var(--red)}
.pill-btn{border:0;background:var(--sea-soft);color:var(--sea);border-radius:999px;padding:0 14px;min-height:36px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.allocation-summary{display:grid;grid-template-columns:.82fr 1.36fr .92fr;gap:8px}
.stat{min-width:0;border:0;border-radius:14px;background:var(--paper);padding:10px 11px 9px;text-align:left;color:inherit}
.stat small,.stat b,.stat span{display:block}
.stat small{font-size:11.5px;font-weight:650;color:var(--muted)}
.stat b{font-size:19px;line-height:1.3;margin-top:2px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;line-height:1.4;color:var(--faint);margin-top:1px}
.stat-btn{cursor:pointer;background:var(--red-soft)}
.stat-btn b{color:var(--red)}
.stat-btn small:after{content:" ›";font-weight:800}
.stat.over b{color:#9a3a26}

.phase-rail{display:flex;flex-direction:column;margin-top:10px}
.seg{position:relative;display:flex;align-items:center;gap:8px}
.seg:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line-strong)}
.seg-end{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;align-items:center;min-height:40px;padding:4px 0}
.seg-end:first-child:before,.seg-end:last-child:before{content:"";position:absolute;left:10px;width:2px;background:var(--line-strong)}
.seg-end:first-child:before{top:50%;bottom:0}.seg-end:last-child:before{top:0;bottom:50%}
.seg-end .seg-mark{position:relative;z-index:1;justify-self:center;width:12px;height:12px;border-radius:3px;background:var(--c-gz);box-shadow:0 0 0 3px var(--card)}
.seg-end b{display:block;font-size:14px;font-weight:750;line-height:1.35}
.seg-end span span{display:block;font-size:12px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.ledger{margin-top:12px}
.lg-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--faint)}
.lg-bar{display:flex;height:28px;border-radius:9px;overflow:hidden;margin-top:6px;background:var(--paper)}
.lg-bar i{display:flex;align-items:center;justify-content:center;min-width:3px;font-style:normal;font-size:10.5px;font-weight:750;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:inset -1px 0 0 var(--card);font-variant-numeric:tabular-nums}
.lg-bar i.t{background:repeating-linear-gradient(135deg,#dcae9f 0 4px,#f0dcd4 4px 8px);color:#7a3a2a}
.lg-bar i.o{background:#e3ddd1;color:var(--muted)}
.lg-sum{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.lg-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.lg-sum b.lg-t{color:var(--red)}
.seg:first-child:before{top:50%}.seg:last-child:before{bottom:50%}
.seg.transit:before{background:repeating-linear-gradient(180deg,var(--red) 0 4px,transparent 4px 8px);opacity:.55}
.seg.is-current:after{content:"";position:absolute;inset:3px -8px;border-radius:12px;background:var(--sea-soft);z-index:0}
.seg-main{position:relative;z-index:1;flex:1;min-width:0;display:grid;grid-template-columns:22px minmax(0,1fr) auto 14px;column-gap:10px;align-items:center;border:0;background:none;padding:9px 0;text-align:left;cursor:pointer;color:inherit;min-height:48px}
.seg-mark{justify-self:center;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card)}
.seg.transit .seg-mark{width:20px;height:20px;background:var(--card);color:var(--red);box-shadow:none;display:grid;place-items:center}
.seg.transit .seg-mark svg{width:15px;height:15px}
.seg-text b,.seg-text span{display:block}
.seg-text b{font-size:15.5px;font-weight:750;line-height:1.35}
.seg-text span{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:1px;font-variant-numeric:tabular-nums}
.seg.transit .seg-main{padding:6px 0;min-height:44px}
.seg.transit .seg-text b{font-size:13.5px;font-weight:650;color:#7a3a2a}
.seg.transit .seg-text span{font-size:12px}
.seg-nights{font-size:15px;font-weight:750;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tk-body{min-width:0}
.tk-body .tk+.tk{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:8px}
.tk-end{display:block;min-width:0}
.tk-end b{display:block;font-size:17px;line-height:1.25;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.tk-end b em{font-style:normal;font-size:10.5px;font-weight:750;color:var(--red);margin-right:3px;vertical-align:2px}
.tk-end span{display:block;font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap}
.tk-end.r{text-align:right}
.tk-mid{display:block;min-width:0;text-align:center}
.tk-mid small{display:block;font-size:11px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-mid i{display:block;position:relative;height:1.5px;margin:3px 2px;background:var(--red);opacity:.7}
.tk-mid i:after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid var(--red);border-right:0}
.seg.transit .seg-main{padding:9px 0}
.overview.editing .seg.transit{flex-wrap:wrap}
.overview.editing .seg.transit .modes{margin:0 0 8px 32px}
.sum-legs{border-top:1px solid var(--line);padding:10px 14px}
.leg-tk+.leg-tk{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.seg-chev{color:var(--faint);font-size:17px;line-height:1;justify-self:end;transition:transform .2s}
.seg.open .seg-chev{transform:rotate(90deg);color:var(--ink)}
.seg-panel{position:relative;padding:2px 0 12px 32px}
.seg-panel:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line-strong)}
.seg-panel.transit:before{background:repeating-linear-gradient(180deg,var(--red) 0 4px,transparent 4px 8px);opacity:.55}
.seg-panel:last-child:before{bottom:calc(100% - 8px)}
.sp-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sp-facts>div{background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0}
.sp-facts small{display:block;font-size:11px;font-weight:650;color:var(--faint);line-height:1.4}
.sp-facts b{display:block;font-size:14px;font-weight:750;line-height:1.4;font-variant-numeric:tabular-nums}
.sp-facts b+small{color:var(--muted);font-weight:500;margin-top:1px}
.sp-fact-money b{color:var(--red)}
.sp-legs{display:grid;gap:6px;margin-bottom:10px}
.sp-leg{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;background:var(--paper);border-radius:12px;padding:8px 10px}
.sp-t{font-size:12.5px;font-weight:750;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.4}
.sp-t small{display:block;font-size:10.5px;color:var(--faint);font-weight:650}
.sp-leg b{display:block;font-size:13.5px;line-height:1.4}
.sp-leg small{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.sp-leg em{display:block;font-style:normal;font-size:12px;font-weight:650;color:var(--sea);line-height:1.45;margin-top:1px}
.sp-label{display:block;font-size:11px;font-weight:700;color:var(--faint);margin:2px 0 4px}
.sp-days{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.sp-days li+li{border-top:1px solid var(--line)}
.sp-days button{display:grid;grid-template-columns:auto minmax(0,1fr) auto 10px;gap:8px;align-items:center;width:100%;min-height:44px;border:0;background:none;padding:8px 10px;text-align:left;cursor:pointer;color:inherit;font-size:13px;line-height:1.4}
.sp-days button:active{background:var(--paper)}
.sp-date{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-title{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-bud{color:var(--red);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-go{color:var(--faint)}
.sp-unknown{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--gold)}
.modes{position:relative;z-index:1;display:none;padding:3px;gap:2px;border-radius:12px;background:var(--paper);flex:none}
.modes button{min-width:48px;min-height:38px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,59,67,.16)}
.overview.editing .modes{display:flex}
.mode-cmp{display:grid;gap:6px;margin-bottom:10px}
.mode-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 11px;cursor:pointer;color:inherit}
.mode-opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft);box-shadow:inset 0 0 0 1px var(--sea)}
.mo-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mo-head b{font-size:14px;font-weight:750}
.mo-head span{font-size:12px;font-weight:700;color:var(--muted)}
.mo-line{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.mo-eff{display:block;font-size:12px;font-weight:650;color:var(--ink);line-height:1.5;margin-top:3px}
.mo-eff b.up{color:var(--red)}.mo-eff b.down{color:#2b7a5a}
.mode-opt[aria-pressed="true"] .mo-eff{color:var(--sea)}
.stepper{position:relative;z-index:1;display:none;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.stepper button:disabled{color:#b9b3a8;background:var(--paper);border-color:var(--line);cursor:not-allowed}
.stepper output{min-width:42px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums}
.overview.editing .stepper{display:flex}
.overview.editing .seg.adjustable .seg-nights{display:none}
.overview.editing .seg.stay:not(.adjustable) .seg-nights{color:var(--faint)}
.ov-actions{display:flex;gap:8px;margin-top:10px}
.adjust-toggle{flex:1;min-height:44px;border:1px solid var(--line-strong);border-radius:13px;background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.adjust-toggle[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.reset-btn{min-height:44px;border:0;border-radius:13px;background:var(--paper);padding:0 14px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer}
.limit-note{margin-top:10px;border-radius:12px;padding:9px 12px;background:var(--sea-soft);color:var(--sea);font-size:12.5px;font-weight:650;line-height:1.5}
.limit-note.over{background:var(--red-soft);color:#943c2b}
[hidden]{display:none!important}

/* 日期条 */
.rail-wrap{position:sticky;top:0;z-index:20;margin:14px -16px 0;padding:8px 0;background:rgba(244,240,231,.9);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);box-shadow:0 1px 0 var(--line)}
.date-rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 16px;scroll-padding-inline:16px;overscroll-behavior-x:contain}
.date-rail::-webkit-scrollbar{display:none}
.date{flex:0 0 56px;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 0 6px;text-align:center;cursor:pointer;scroll-snap-align:center;color:inherit}
.date:before{content:"";position:absolute;left:12px;right:12px;top:4px;height:3px;border-radius:3px;background:var(--c)}
.date.moving:before{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.date b,.date span,.date i{display:block;white-space:nowrap}
.date b{font-size:17px;line-height:1.2;font-weight:750;font-variant-numeric:tabular-nums}
.date span{font-size:11px;color:var(--muted);line-height:1.3}
.date i{font-style:normal;font-size:11px;font-weight:700;color:var(--c);line-height:1.4;margin-top:1px}
.date[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.date[aria-selected="true"] span{color:#c8d8d8}
.date[aria-selected="true"] i{color:#fff}
.date.today:after{content:"今天";position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:6px;padding:0 5px;line-height:15px}

/* 每日卡片 */
.stage{margin-top:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);touch-action:pan-y}
.day.swap{animation:swap .26s ease-out}
@keyframes swap{from{opacity:.25;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.day-visual{position:relative;margin:0;aspect-ratio:16/7;background:linear-gradient(135deg,#e4ece9,#eef2ee);overflow:hidden}
.photo-btn{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.day-photo{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.day-photo.ready{opacity:1}
.day-visual.photo-fail:before{content:"图片暂时无法加载\A" attr(data-alt);white-space:pre-line;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px;color:var(--muted);font-size:13px;font-weight:650;line-height:1.7}
.day-visual.photo-fail .photo-btn{display:none}
.photo-credit{position:absolute;right:8px;bottom:8px;max-width:75%;color:#fff;background:rgba(17,43,48,.62);border-radius:999px;padding:3px 9px;font-size:10.5px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom-hint{position:absolute;left:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(17,43,48,.55);color:#fff;display:grid;place-items:center;pointer-events:none}
.zoom-hint svg{width:15px;height:15px}
.day-visual.photo-fail .zoom-hint{display:none}
.day-head{padding:14px 18px 0}
.day-kicker{font-size:12.5px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.day-title{font-size:22px;line-height:1.3;margin:3px 0 6px;font-weight:750}
.day-note{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.day-summary{margin:14px 18px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.summary-label{display:block;color:var(--faint);font-size:11.5px;font-weight:700;margin-bottom:4px}
.sum-route{padding:11px 14px 12px}
.route-chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px}
.route-node{font-size:14px;font-weight:600;line-height:1.45}
.route-node.is-end{font-weight:750}
.route-arrow{color:var(--red);font-size:12px;opacity:.75}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.sum-cell{padding:10px 14px;min-width:0}
.sum-cell+.sum-cell{border-left:1px solid var(--line)}
.sum-cell b{display:block;font-size:15px;font-weight:750;line-height:1.4}
.sum-cell small{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px}
.state-line{display:flex;flex-wrap:wrap;gap:4px}
.state-chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:650;line-height:1.5;background:var(--sea-soft);color:var(--sea)}
.state-chip.moving{background:var(--red-soft);color:var(--red)}
.day-budget{padding:10px 14px 11px}
.day-budget b{display:block;color:var(--red);font-size:21px;line-height:1.3;font-weight:750;font-variant-numeric:tabular-nums}
.day-budget small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
.unknown{display:block;border-top:1px solid #ecdfc3;background:var(--gold-soft);color:var(--gold);padding:9px 14px 9px 36px;position:relative;font-size:12.5px;font-weight:650;line-height:1.5}
.unknown:before{content:"!";position:absolute;left:13px;top:10px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--gold-soft);font-size:11px;font-weight:800;line-height:16px;text-align:center}
.steps-label{padding:18px 18px 0}
.steps{padding:0 12px 2px}

.cb-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

}

.progress-track{height:5px;border-radius:4px;background:var(--line);margin:9px 0;overflow:hidden}

.modes button:disabled,.mode-opt:disabled,.reset-btn:disabled{opacity:.55;cursor:not-allowed}
.date.past:not([aria-selected="true"]){background:var(--paper);color:var(--muted)}

<body>
<main class="shell">
  <div class="col-left">
    <header class="mast">
      <picture class="hero-art">
        <source srcset="img/personal-trip-watercolor.webp" type="image/webp">

      </picture>

function focusables(){return Array.prototype.filter.call(sheet.querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])'),function(x){return x.offsetParent!==null})}
function openSheet(label,html,focus){
 lastFocus=focus||document.activeElement;$("sheetLabel").textContent=label;content.innerHTML=html;sheet.scrollTop=0;sheet.style.transform="";
 overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");document.documentElement.classList.add("locked");
 $("closeSheet").focus({preventScroll:true});
}
function closeSheet(skipFocus){
 overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true");document.documentElement.classList.remove("locked");sheet.style.transform="";
 if(!skipFocus&&lastFocus&&lastFocus.focus){if(lastFocus.isConnected)lastFocus.focus({preventScroll:true});else{var replacement=lastFocus.dataset.step?steps.querySelector('[data-step="'+lastFocus.dataset.step+'"]'):$("bookingSummary");if(replacement)replacement.focus({preventScroll:true})}}
}

 if(e.key==="Tab"){var f=focusables();if(!f.length)return;var first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
