name: Apply mobile hotel deck redesign

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-mobile-hotel-deck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Nate hotel cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nate/index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '/* ---------- mobile hotel deck ---------- */'
          css = r'''
/* ---------- mobile hotel deck ---------- */
@media (max-width:640px){
  #hotels{
    display:flex;
    align-items:flex-start;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    scroll-padding-inline:9%;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    gap:0;
    padding:12px 9% 28px;
    margin-left:-1.1rem;
    margin-right:-1.1rem;
    width:calc(100% + 2.2rem);
    background:transparent;
    border:0;
    border-radius:0;
    box-shadow:none;
    scrollbar-width:none;
  }
  #hotels::-webkit-scrollbar{display:none}
  #hotels .hcard{
    position:relative;
    z-index:1;
    flex:0 0 84%;
    min-width:0;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 12px 28px -22px rgba(31,43,61,.5);
    opacity:.68;
    transform:translateY(16px) scale(.9);
    transform-origin:center center;
    transition:transform .28s cubic-bezier(.2,.8,.3,1),
               opacity .28s ease,
               box-shadow .28s ease;
  }
  #hotels .hcard + .hcard{margin-left:-8%}
  #hotels .hcard.focus{
    z-index:4;
    opacity:1;
    transform:translateY(0) scale(1);
    box-shadow:0 24px 46px -26px rgba(31,43,61,.72),0 4px 10px rgba(31,43,61,.08);
  }
  #hotels .hcard:not(.focus) .row{pointer-events:none}
  #hotels .hcard .hpic{height:205px}
  #hotels .hcard .row{
    min-height:0;
    padding:1rem 1rem 1.05rem;
    background:var(--card);
  }
  #hotels .hcard.focus .row.on{background:var(--soft)}
  #hotels .hcard .n1{font-size:.98rem}
  #hotels .hcard .n3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
}
@media (max-width:380px){
  #hotels .hcard{flex-basis:86%}
  #hotels .hcard + .hcard{margin-left:-10%}
  #hotels .hcard .hpic{height:190px}
}
@media (prefers-reduced-motion:reduce){
  #hotels .hcard{transition:none!important}
}
'''

          if css_marker not in text:
            anchor = '\n.cathead{display:flex'
            if anchor not in text:
              raise SystemExit('CSS anchor not found')
            text = text.replace(anchor, '\n' + css + '\n.cathead{display:flex', 1)

          js_marker = 'function setupHotelDeck()'
          js = r'''
var hotelDeckRAF=0;
function hotelDeckMobile(){return window.matchMedia&&window.matchMedia('(max-width:640px)').matches;}
function updateHotelDeckFocus(deck){
  if(!deck) return;
  var cards=[].slice.call(deck.querySelectorAll('.hcard'));
  if(!cards.length) return;
  if(!hotelDeckMobile()){
    cards.forEach(function(c){c.classList.remove('focus');});
    return;
  }
  var r=deck.getBoundingClientRect(),cx=r.left+r.width/2,best=cards[0],bd=Infinity;
  cards.forEach(function(c){
    var cr=c.getBoundingClientRect(),d=Math.abs((cr.left+cr.width/2)-cx);
    if(d<bd){bd=d;best=c;}
  });
  cards.forEach(function(c){c.classList.toggle('focus',c===best);});
}
function centerHotelCard(deck,card,behavior){
  if(!deck||!card||!hotelDeckMobile()) return;
  var left=card.offsetLeft-(deck.clientWidth-card.offsetWidth)/2;
  deck.scrollTo({left:Math.max(0,left),behavior:behavior||'auto'});
}
function setupHotelDeck(){
  var deck=document.getElementById('hotels'); if(!deck) return;
  if(!deck._hotelDeckBound){
    deck._hotelDeckBound=true;
    deck.addEventListener('scroll',function(){
      cancelAnimationFrame(hotelDeckRAF);
      hotelDeckRAF=requestAnimationFrame(function(){updateHotelDeckFocus(deck);});
    },{passive:true});
    window.addEventListener('resize',function(){
      cancelAnimationFrame(hotelDeckRAF);
      hotelDeckRAF=requestAnimationFrame(function(){updateHotelDeckFocus(deck);});
    });
  }
  var selected=S.hotel||'';
  var target=selected?deck.querySelector('.row[data-k="'+selected+'"]').closest('.hcard'):deck.querySelector('.hcard');
  var shouldCenter=deck._hotelDeckSelected!==selected || !deck.querySelector('.hcard.focus');
  deck._hotelDeckSelected=selected;
  requestAnimationFrame(function(){
    if(shouldCenter) centerHotelCard(deck,target,'auto');
    updateHotelDeckFocus(deck);
  });
}
'''

          if js_marker not in text:
            anchor = '\nfunction drawHotels(){'
            if anchor not in text:
              raise SystemExit('JS anchor not found')
            text = text.replace(anchor, '\n' + js + '\nfunction drawHotels(){', 1)

          old_all = 'function all(){syncHotel();mapAll();drawVisits();drawHotels();drawPlan();drawSched();}'
          new_all = 'function all(){syncHotel();mapAll();drawVisits();drawHotels();setupHotelDeck();drawPlan();drawSched();}'
          if new_all not in text:
            if old_all not in text:
              raise SystemExit('all() anchor not found')
            text = text.replace(old_all, new_all, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet -- nate/index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nate/index.html
          git commit -m 'feat: add stacked mobile hotel carousel'
          git push origin master

# trigger: 2026-08-20